<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Карьерный Юрист — кадровое агентство юридического рынка, сообщество юристов и мероприятия под одним брендом." />
    <title>Карьерный Юрист</title>

    <!-- Open Graph / Twitter Card — статичные значения по умолчанию.
         Большинство краулеров соцсетей (Telegram, VK, Facebook) не
         выполняют JS, поэтому именно ЭТИ теги видит превью при шаринге
         любой страницы сайта, если её не обошел more specific
         useSocialMeta (см. src/lib/useSocialMeta.ts) — а useSocialMeta
         обходит их только для пользователей, у которых уже открылась SPA
         (сам краулер до него не доходит). Полноценные превью per-страницу
         (конкретная вакансия/мероприятие в шаринге) потребуют
         server-side rendering или pre-render для ботов — это отдельное
         архитектурное решение, не тема этого фикса. -->
    <meta property="og:site_name" content="Карьерный Юрист" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Карьерный Юрист" />
    <meta property="og:description" content="Карьерный Юрист — кадровое агентство юридического рынка, сообщество юристов и мероприятия под одним брендом." />
    <meta property="og:url" content="https://legalcareerist.ru/" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Карьерный Юрист" />
    <meta name="twitter:description" content="Карьерный Юрист — кадровое агентство юридического рынка, сообщество юристов и мероприятия под одним брендом." />
  </head>
  <body>
    <!-- Чистый CSS-лоадер, без JS — виден на время hydrateFromServer()
         (main.tsx, обычно доли секунды, максимум ~1.2с при недоступном
         бэкенде) до первого рендера React, который заменяет #root целиком. -->
    <style>
      #boot-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; }
      #boot-loader svg { animation: boot-pulse 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { #boot-loader svg { animation: none; opacity: .6; } }
    </style>
    <div id="root">
      <div id="boot-loader">
        <svg viewBox="20 0 50 100" width="28" height="56" stroke="#283953" stroke-width="5" stroke-linecap="round" fill="none">
          <line x1="26" y1="88" x2="26" y2="48" />
          <line x1="39" y1="74" x2="39" y2="34" />
          <line x1="52" y1="60" x2="52" y2="20" />
          <line x1="65" y1="46" x2="65" y2="6" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
